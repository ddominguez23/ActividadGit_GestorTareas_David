<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestor de tareas</title>

    <style>
        #btn-add {
            background: red;
            color: white;
            padding: 6px 12px;
            border: none;
            cursor: pointer;
        }

        #btn-delete {
            background: blue;
            color: white;
            padding: 6px 12px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Gestor de tareas</h1>

    <input id="taskInput" type="text" placeholder="Escribe una tarea">

    <button id="btn-add" onclick="addTask()">Añadir tarea</button>
    <button id="btn-delete">Eliminar tarea</button>

    <ul id="taskList"></ul>

    <script>
        let tasks = [];
        let nextId = 1;
        let selectedId = null;

        function readInputTrimmed() {
            return document.getElementById("taskInput").value.trim();
        }

        function clearInput() {
            document.getElementById("taskInput").value = "";
        }

        function setStatus(msg, type) {
            console.log(msg);
        }

        function render() {
            const list = document.getElementById("taskList");
            list.innerHTML = "";
            tasks.forEach(t => {
                const li = document.createElement("li");
                li.textContent = t.text + " (ID " + t.id + ")";
                li.onclick = () => { selectedId = t.id; };
                list.appendChild(li);
            });
        }

        function addTask() {
            const text = readInputTrimmed();

            if (!text) {
                setStatus("No puedes añadir una tarea vacía.", "danger");
                return;
            }

            tasks.push({
                id: nextId++,
                text: text,
                done: false
            });

            clearInput();
            setStatus("Tarea añadida correctamente.", "ok");
            render();
        }
    </script>

</body>
</html>
